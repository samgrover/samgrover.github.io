  <script>
    
    const htmlClass = document.documentElement.classList;
    setTimeout(() => {
      htmlClass.remove('not-ready');
    }, 10);

    
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const lightBg = '#e6d8bb'.replace(/"/g, '');
    const darkBg = '#1f0a05'.replace(/"/g, '');
    const setDark = (isDark) => {
      metaTheme.setAttribute('content', isDark ? darkBg : lightBg);
      htmlClass[isDark ? 'add' : 'remove']('dark');
      localStorage.setItem('dark', isDark);
    };

    
    const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    let isDarkMode;
    if (htmlClass.contains('dark')) {
      isDarkMode = true;
    } else {
      const darkVal = localStorage.getItem('dark');
      isDarkMode = darkVal ? darkVal === 'true' : darkScheme.matches;
    }
    
    setDark(isDarkMode);

    
    darkScheme.addEventListener('change', (event) => {
      setDark(event.matches);
    });

    
    const btnDark = document.querySelector('.btn-dark');
    btnDark.addEventListener('click', () => {
      setDark(localStorage.getItem('dark') !== 'true');
    });
  </script>

<style>
  #search-form {
    position: relative;
    max-width: var(--measure);
    margin: 2rem 0;
  }

   
  #search-input::-webkit-search-cancel-button {
    display: none;
  }

  .search-result-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(26rem, 100%), 1fr));
    column-gap: 3rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .search-result-list > li {
    margin: 0;
  }

  #search-input {
    width: 100%;
    padding: 0.75rem 2.5rem 0.75rem 1rem;
    font-size: 1.1rem;
    font-family: var(--font-body);
    border: 2px solid var(--accent);
    border-radius: 8px;
    background: transparent;
    color: var(--text-light);
    transition: border-color 0.2s;
  }

  html.dark #search-input {
    color: var(--text-dark);
    border-color: var(--accent-dark);
  }

  #search-input:focus {
    outline: none;
    border-color: var(--accent);
    opacity: 0.8;
  }

  #clear-search {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    width: 2rem;
    height: 2rem;
    border: none;
    background: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-light);
    opacity: 0;
    transition: opacity 0.2s;
    display: none;
  }

  html.dark #clear-search {
    color: var(--text-dark);
  }

  #search-input:not(:placeholder-shown) + #clear-search {
    opacity: 0.5;
    display: block;
  }

  #clear-search:hover {
    opacity: 1 !important;
  }

  #search-status {
    margin: 1rem 0;
    font-size: 0.9rem;
    opacity: 0.7;
  }

  .search-result-year {
    font-size: 1.3rem;
    font-weight: bold;
    margin: 2rem 0 1rem 0;
    font-family: var(--font-display);
  }

  .search-result-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(0,0,0,0.1);
    transition: opacity 0.2s;
  }

  html.dark .search-result-item {
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .search-result-item:hover {
    opacity: 0.7;
  }

  .search-result-image {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .search-result-content {
    flex: 1;
    min-width: 0;
  }

  .search-result-date {
    font-size: 0.85rem;
    opacity: 0.7;
  }

  .search-result-title {
    font-weight: 500;
    margin: 0.25rem 0;
  }

  .search-result-excerpt {
    font-size: 0.85rem;
    opacity: 0.8;

  }

  .search-no-results {

  .sr-only {

</style>

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">Search</h1>
  </header>

  <div class="post-content">
    <p>Search all posts from 2004 to present.</p>


    <form id="search-form" role="search">
      <label for="search-input" class="sr-only">Search posts</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search posts..."
        autocomplete="off"
        autofocus
        aria-label="Search posts"
      />
      <button type="button" id="clear-search" aria-label="Clear search">×</button>
    </form>

    <div id="search-status" aria-live="polite" aria-atomic="true"></div>

    <div id="search-results"></div>
  </div>
</article>

<script src="/fuse.min.js"></script>
<script>
(function() {
  const searchInput = document.getElementById('search-input');
  const clearButton = document.getElementById('clear-search');
  const searchStatus = document.getElementById('search-status');
  const searchResults = document.getElementById('search-results');
  const searchForm = document.getElementById('search-form');

  let fuse;
  let searchIndex;

  
  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
  });

  
  fetch('/search.json')
    .then(response => response.json())
    .then(data => {
      searchIndex = data;

      
      fuse = new Fuse(searchIndex, {
        keys: [
          { name: 'title', weight: 0.4 },
          { name: 'content', weight: 0.4 },
          { name: 'excerpt', weight: 0.2 }
        ],
        threshold: 0.1,
        distance: 10,
        minMatchCharLength: 2,
        ignoreLocation: true,
        includeScore: true
      });

      
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      if (query) {
        searchInput.value = query;
        performSearch(query);
      }
    })
    .catch(error => {
      console.error('Error loading search index:', error);
      searchStatus.textContent = 'Search unavailable. Please try again later.';
    });

  
  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim();

    if (query.length < 2) {
      searchResults.innerHTML = '';
      searchStatus.textContent = '';
      return;
    }

    performSearch(query);
  });

  
  clearButton.addEventListener('click', () => {
    searchInput.value = '';
    searchResults.innerHTML = '';
    searchStatus.textContent = '';
    searchInput.focus();

    
    const url = new URL(window.location);
    url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
  });

  
  function performSearch(query) {
    if (!fuse) return;

    const results = fuse.search(query);

    
    const url = new URL(window.location);
    url.searchParams.set('q', query);
    window.history.replaceState({}, '', url);

    
    searchStatus.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"`;

    if (results.length === 0) {
      searchResults.innerHTML = '<div class="search-no-results">No posts found. Try different keywords.</div>';
      return;
    }

    
    const resultsByYear = {};
    results.forEach(result => {
      const post = result.item;
      const year = post.year;

      if (!resultsByYear[year]) {
        resultsByYear[year] = [];
      }

      resultsByYear[year].push(post);
    });

    
    let html = '';
    const years = Object.keys(resultsByYear).sort((a, b) => b - a); 

    years.forEach(year => {
      html += `<h3 class="search-result-year">${year}</h3>`;
      html += '<ul class="search-result-list">';

      resultsByYear[year].forEach(post => {
        html += '<li class="search-result-item">';

        
        if (post.image) {
          html += `<img src="${post.image}" alt="" class="search-result-image" loading="lazy">`;
        }

        html += '<div class="search-result-content">';
        html += `<div class="search-result-date">${post.dateFormatted}</div>`;
        html += `<div class="search-result-title"><a href="${post.url}">${escapeHtml(post.title)}</a></div>`;

        
        if (post.title === post.excerpt) {
          html += `<div class="search-result-excerpt">${escapeHtml(post.excerpt)}</div>`;
        }

        html += '</div></li>';
      });

      html += '</ul>';
    });

    searchResults.innerHTML = html;
  }

  
  function escapeHtml(text) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }
})();
</script>
