  <script>
    document.addEventListener('load', (event) => {
      const image = event.target;
      if (image.tagName !== 'IMG' || !image.closest('.post-body')) return;
      const holder = image.closest('figure, p');
      if (!holder) return;
      holder.style.setProperty('--ar', (image.naturalWidth / image.naturalHeight).toFixed(4));
      holder.style.setProperty('--native-width', `${image.naturalWidth}px`);
      schedulePhotoRowLimit();
    }, true);

    
    
    
    function limitPhotoRows() {
      const limit = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--photos-per-row'), 10);
      document.querySelectorAll('.photo-row-break').forEach((rowBreak) => rowBreak.remove());
      document.querySelectorAll('.post-body').forEach((body) => {
        let rowTop = null;
        let photosInRow = 0;
        body.querySelectorAll(':scope > :is(figure, .post-photo)').forEach((photo) => {
          if (photo.offsetTop !== rowTop) {
            rowTop = photo.offsetTop;
            photosInRow = 0;
          }
          photosInRow += 1;
          if (photosInRow > limit) {
            const rowBreak = document.createElement('span');
            rowBreak.className = 'photo-row-break';
            photo.before(rowBreak);
            rowTop = photo.offsetTop;
            photosInRow = 1;
          }
        });
      });
    }

    
    let photoRowLimitPending = false;
    function schedulePhotoRowLimit() {
      if (photoRowLimitPending) return;
      photoRowLimitPending = true;
      requestAnimationFrame(() => {
        photoRowLimitPending = false;
        limitPhotoRows();
      });
    }

    document.addEventListener('DOMContentLoaded', schedulePhotoRowLimit);
    window.addEventListener('resize', schedulePhotoRowLimit);
  </script>

  <script>
    
    const htmlClass = document.documentElement.classList;
    setTimeout(() => {
      htmlClass.remove('not-ready');
    }, 10);

    
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const lightBg = '#fdd4b8'.replace(/"/g, '');
    const darkBg = '#1f0807'.replace(/"/g, '');
    const setDark = (isDark) => {
      metaTheme.setAttribute('content', isDark ? darkBg : lightBg);
      htmlClass[isDark ? 'add' : 'remove']('dark');
      localStorage.setItem('dark', isDark);
    };

    
    const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    let isDarkMode;
    if (htmlClass.contains('dark')) {
      isDarkMode = true;
    } else {
      const darkVal = localStorage.getItem('dark');
      isDarkMode = darkVal ? darkVal === 'true' : darkScheme.matches;
    }
    
    setDark(isDarkMode);

    
    darkScheme.addEventListener('change', (event) => {
      setDark(event.matches);
    });

    
    const btnDark = document.querySelector('.btn-dark');
    btnDark.addEventListener('click', () => {
      setDark(localStorage.getItem('dark') !== 'true');
    });
  </script>
