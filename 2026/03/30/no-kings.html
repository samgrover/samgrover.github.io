  <script>
    
    const htmlClass = document.documentElement.classList;
    setTimeout(() => {
      htmlClass.remove('not-ready');
    }, 10);

    
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const lightBg = '#e6d8bb'.replace(/"/g, '');
    const darkBg = '#1f0a05'.replace(/"/g, '');
    const setDark = (isDark) => {
      metaTheme.setAttribute('content', isDark ? darkBg : lightBg);
      htmlClass[isDark ? 'add' : 'remove']('dark');
      localStorage.setItem('dark', isDark);
    };

    
    const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    let isDarkMode;
    if (htmlClass.contains('dark')) {
      isDarkMode = true;
    } else {
      const darkVal = localStorage.getItem('dark');
      isDarkMode = darkVal ? darkVal === 'true' : darkScheme.matches;
    }
    
    setDark(isDarkMode);

    
    darkScheme.addEventListener('change', (event) => {
      setDark(event.matches);
    });

    
    const btnDark = document.querySelector('.btn-dark');
    btnDark.addEventListener('click', () => {
      setDark(localStorage.getItem('dark') !== 'true');
    });
  </script>

  <div class="post-sheet"><section class="post-body"><p>Some photos from the No Kings protest a couple of days ago. As always people brought wonderful energy and excellent signs.</p>
<figure>
  <a href="https://live.staticflickr.com/65535/55178484436_d2f4d2d75e_h.jpg"><img src="https://live.staticflickr.com/65535/55178484436_d2f4d2d75e_h.jpg" alt="A large crowd of people walks up the ramp to a bridge holding signs, surrounded by blooming cherry blossom trees. A number of people are also on the park next to it."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55178885545_4f9587bc1a_h.jpg"><img src="https://live.staticflickr.com/65535/55178885545_4f9587bc1a_h.jpg" alt="Protest scene with a crowd holding various signs, such as &#34;End MAGA this November&#34; and other messages about rights and political change, set against a backdrop of flowering trees."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55177596462_8b72f0d1be_h.jpg"><img src="https://live.staticflickr.com/65535/55177596462_8b72f0d1be_h.jpg" alt="A river with boats, one flying a Palestine flag, flows in the foreground. In the background, a cityscape with buildings and a bridge is visible. Numerous people are marching up the bridge, with cherry blossom trees lining the path."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55177596607_c1f8e090e4_h.jpg"><img src="https://live.staticflickr.com/65535/55177596607_c1f8e090e4_h.jpg" alt="A diverse group of people participate in a street protest, holding signs with messages such as &#34;No War, No Genocide, No Secret Police&#34; and &#34;Fair Wages Now.&#34; There&#39;s a marching band in bright yellow banana costumes in the midst. The backdrop includes a mural with bold black-and-white patterns."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55178885880_43636e5db5_h.jpg"><img src="https://live.staticflickr.com/65535/55178885880_43636e5db5_h.jpg" alt="A crowd of protesters holding various signs and flags, including American and rainbow flags walk by at the Oregon Convention Center. Signs display messages like &#34;No Kings&#34; and &#34;Fight Ignorance.&#34; A person in medical gear is visible."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55178651523_f9b215e0ea_h.jpg"><img src="https://live.staticflickr.com/65535/55178651523_f9b215e0ea_h.jpg" alt="A protest scene with a diverse crowd holding various signs. Notable signs include messages like &#34;Vaccines cause adults.&#34; Rainbow and American flags are visible along with other banners. Trees and buildings are in the background."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55178886070_98317d928b_h.jpg"><img src="https://live.staticflickr.com/65535/55178886070_98317d928b_h.jpg" alt="A diverse group of people participating in a protest, holding various signs with messages related to democracy, peace, and social justice. The setting is urban with modern buildings in the background and trees lining the street."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55177620332_6b98d471aa_h.jpg"><img src="https://live.staticflickr.com/65535/55177620332_6b98d471aa_h.jpg" alt="Protesters holding signs and flags walk on a bridge above a street lined with parked cars."></a>
  
</figure>

<figure>
  <a href="https://live.staticflickr.com/65535/55178739944_095e24c40a_h.jpg"><img src="https://live.staticflickr.com/65535/55178739944_095e24c40a_h.jpg" alt="People walk down a street; one carries an American flag, and another is wearing an inflatable green frog costume with a red cape. Trees line the road, and cars and bicycles are visible in the background."></a>
